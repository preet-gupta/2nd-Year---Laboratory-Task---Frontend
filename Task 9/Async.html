<!DOCTYPE html>
<html>
<head>
    <title>Asynchronous Programming</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            cursor: pointer;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #result {
            margin-top: 25px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Asynchronous Programming</h1>

    <button onclick="fetchData()">Fetch Data using setTimeout</button>

    <button onclick="fetchPromise()">Fetch Data using Promise</button>

    <h3 id="result">Click a button to fetch data</h3>

    <script>

        function fetchData() {

            document.getElementById("result").innerHTML = "Fetching data...";

            setTimeout(function() {

                document.getElementById("result").innerHTML =
                    "Data received successfully from server!";

            }, 3000);

        }


        function fetchPromise() {

            document.getElementById("result").innerHTML = "Fetching data...";

            let promise = new Promise(function(resolve, reject) {

                setTimeout(function() {

                    resolve("Data received successfully using Promise!");

                }, 3000);

            });

            promise.then(function(data) {

                document.getElementById("result").innerHTML = data;

            });

        }

    </script>

</body>
</html>
