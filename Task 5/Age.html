<!DOCTYPE html>
<html>
<head>
    <title>Voting Eligibility</title>
</head>
<body>

    <h2>Voting Eligibility Checker</h2>

    <label>Enter Your Age:</label>
    <input type="number" id="age" placeholder="Enter age">

    <button onclick="checkEligibility()">Check</button>

    <h3 id="result"></h3>

    <script>
        function checkEligibility() {
            let age = document.getElementById("age").value;

            if (age === "" || age < 0) {
                document.getElementById("result").innerHTML = "Please enter a valid age";
            }
            else if (age >= 18) {
                document.getElementById("result").innerHTML = "You are eligible to vote.";
            }
            else {
                document.getElementById("result").innerHTML = "You are not eligible to vote.";
            }
        }
    </script>

</body>
</html>
