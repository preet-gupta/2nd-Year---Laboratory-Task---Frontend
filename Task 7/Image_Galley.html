<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 30px;
        }

        #mainImage {
            width: 500px;
            height: 300px;
            object-fit: cover;
            border: 2px solid black;
        }

        .thumbnails img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            margin: 10px;
            cursor: pointer;
            border: 2px solid gray;
        }
    </style>
</head>

<body>

    <h1>Image Gallery</h1>

    <img id="mainImage"
         src="https://picsum.photos/id/10/500/300">

    <div class="thumbnails">

        <img src="https://picsum.photos/id/10/500/300" class="thumb">

        <img src="https://picsum.photos/id/20/500/300" class="thumb">

        <img src="https://picsum.photos/id/30/500/300" class="thumb">

        <img src="https://picsum.photos/id/40/500/300" class="thumb">

    </div>

    <script>
        let mainImage = document.getElementById("mainImage");

        let thumbnails = document.querySelectorAll(".thumb");

        thumbnails.forEach(function(img) {

            img.addEventListener("click", function() {

                mainImage.src = img.src;

            });

        });
    </script>

</body>
</html>
